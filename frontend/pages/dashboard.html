<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DockYard — Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <nav class="navbar">
    <span class="navbar-title">⚓ DockYard</span>
    <button class="btn btn-secondary btn-sm navbar-logout" onclick="logout()">Logout</button>
  </nav>

  <div class="dashboard-container">
    <div class="dashboard-header">
      <h2>My Projects</h2>
      <div style="display:flex;gap:0.75rem;align-items:center">
        <input
          type="search"
          class="form-input search-input"
          placeholder="Search projects..."
          oninput="onSearch(this.value)"
        >
        <a href="add-project.html" class="btn btn-primary">+ Add Project</a>
      </div>
    </div>
    <div id="projects-grid" class="projects-grid">
      <div class="empty-state"><span class="spinner"></span></div>
    </div>
    <div id="pagination" style="display:flex;gap:1rem;align-items:center;justify-content:center;margin-top:1.5rem"></div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
