<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DockYard — Project Details</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
</head>
<body>

  <nav class="navbar">
    <span class="navbar-title">⚓ DockYard</span>
    <button class="btn btn-secondary btn-sm navbar-logout" onclick="logout()">Logout</button>
  </nav>

  <div class="details-container" id="details-container">
    <div id="alert" class="alert alert-error" style="display:none"></div>

    <div class="details-split" id="details-split">

      <!-- LEFT PANEL: terminal -->
      <div class="details-right-panel" id="terminal-section" style="display:none">
        <div class="terminal-topbar" id="terminal-topbar">
          <span class="terminal-label">Terminal</span>
          <button class="btn btn-secondary btn-sm" onclick="reconnectTerminal()">↻ Reconnect</button>
        </div>
        <div id="terminal-container"></div>

        <!-- Logs inline — shown only for web+terminal -->
        <div class="terminal-logs-panel" id="terminal-logs-panel" style="display:none">
          <div class="terminal-topbar" style="border-top:1px solid #2d3748">
            <span class="terminal-label">Logs</span>
            <button class="btn btn-secondary btn-sm" onclick="refreshLogs()">↻ Refresh</button>
          </div>
          <pre id="logs-output-side" class="terminal-logs-pre">No logs yet.</pre>
        </div>
      </div>

      <!-- RIGHT PANEL: info + actions -->
      <div class="details-left-panel">

        <div class="details-top">
          <h1 id="title" class="details-title">Loading...</h1>
          <span id="status-badge" class="badge badge-stopped">stopped</span>
        </div>

        <div id="countdown" class="countdown" style="display:none"></div>
        <div id="open-app" style="display:none; margin-top:0.75rem">
          <a id="open-app-link" href="#" target="_blank" class="open-app-link">🔗 Open App</a>
        </div>

        <div class="meta-grid">
          <div class="meta-item">
            <span class="meta-label">Docker Image</span>
            <code id="docker-image" class="meta-value meta-mono">—</code>
          </div>
          <div class="meta-item">
            <span class="meta-label">Repository</span>
            <span id="repository" class="meta-value">—</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Auto-stop</span>
            <span id="auto-stop" class="meta-value">—</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Created</span>
            <span id="created-at" class="meta-value">—</span>
          </div>
        </div>

        <div class="description-section">
          <span class="meta-label">Description</span>
          <p id="description" class="description-body">—</p>
        </div>

        <div class="files-section">
          <div class="files-header">
            <span class="meta-label">Files</span>
            <button class="btn btn-secondary btn-sm" id="upload-btn" onclick="document.getElementById('file-input').click()">+ Upload</button>
            <input type="file" id="file-input" style="display:none" onchange="handleFileUpload(event)">
          </div>
          <div id="files-list" class="files-list"></div>
        </div>

        <div class="details-actions">
          <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'">← Back</button>
          <button id="launch-btn" class="btn btn-primary" onclick="launchContainer()">▶ Run Docker</button>
          <button id="stop-btn" class="btn btn-danger" onclick="stopContainer()" style="display:none">■ Stop</button>
          <button class="btn btn-secondary" onclick="editProject()">✏ Edit</button>
          <button class="btn btn-danger" onclick="deleteProject()">🗑 Delete</button>
        </div>

      </div>

    </div>

    <!-- LOGS + FILES -->
    <div class="details-bottom-card">

      <div id="bottom-logs-section">
        <div class="section-header">
          <h3 class="section-title">Container Logs</h3>
          <div style="display:flex;gap:0.5rem;align-items:center">
            <label style="font-size:0.8rem;color:#64748b;cursor:pointer">
              <input type="checkbox" id="logs-auto-refresh" checked style="margin-right:0.3rem">Auto-refresh
            </label>
            <button class="btn btn-secondary btn-sm" onclick="refreshLogs()">↻ Refresh</button>
          </div>
        </div>
        <pre id="logs-output" class="logs-pre">No logs yet.</pre>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/project-details.js"></script>
</body>
</html>
