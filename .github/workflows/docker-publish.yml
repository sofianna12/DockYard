name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main

env:
  DOCKERHUB_USERNAME: asofia32  

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dockyard-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dockyard-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dockyard-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dockyard-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
